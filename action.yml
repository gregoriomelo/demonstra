name: 'Demonstra Visual PR Review'
description: 'Record test videos/screenshots in CI and publish interactive visual reviews with animated WebP and MP4 timeline scrubbing on pull requests.'
author: 'demonstra.me'
branding:
  icon: 'video'
  color: 'red'

inputs:
  command:
    description: 'The test command to execute and record (e.g. "npx playwright test")'
    required: true
    default: 'npx playwright test'
  results-dir:
    description: 'Directory where test video and screenshot artifacts are stored'
    required: false
    default: './test-results'
  report-file:
    description: 'Optional path to Playwright JSON report file'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with repository write and pull request permissions'
    required: false
    default: ${{ github.token }}
  branch:
    description: 'Orphan branch name used to store visual review media assets'
    required: false
    default: 'demonstra-assets'
  strict:
    description: 'Fail the action step with non-zero exit code if visual publishing fails'
    required: false
    default: 'false'
  version:
    description: 'Version of demonstra CLI to use (defaults to latest release)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Validate GitHub Token
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::Demonstra requires a GitHub token with 'contents: write' and 'pull-requests: write' permissions. Please pass 'github-token' input and ensure permissions are configured in your workflow."
          exit 1
        fi

    - name: Ensure FFmpeg is installed
      shell: bash
      run: |
        if ! command -v ffmpeg >/dev/null 2>&1; then
          echo "FFmpeg not detected. Installing FFmpeg..."
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            echo "::error::Unsupported OS for automated FFmpeg installation: $RUNNER_OS"
            exit 1
          fi
        fi
        echo "FFmpeg is ready: $(ffmpeg -version | head -n 1)"

    - name: Install Demonstra CLI
      shell: bash
      env:
        DEMONSTRA_VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.github-token }}
      run: |
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64) GOARCH="amd64" ;;
          aarch64|arm64) GOARCH="arm64" ;;
          *) echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        INSTALL_DIR="${RUNNER_TEMP:-/tmp}/demonstra-bin"
        mkdir -p "$INSTALL_DIR"
        BIN_NAME="demonstra-${OS}-${GOARCH}"
        TARGET="$INSTALL_DIR/demonstra"

        # Check if local fallback binary exists (for repo testing)
        if [ -f "$GITHUB_ACTION_PATH/bin/$BIN_NAME" ]; then
          cp "$GITHUB_ACTION_PATH/bin/$BIN_NAME" "$TARGET"
        else
          echo "Downloading Demonstra CLI..."
          ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-gregoriomelo/demonstra}"
          BASE_URL="https://github.com/${ACTION_REPO}/releases/download/${DEMONSTRA_VERSION}"
          if [ "$DEMONSTRA_VERSION" = "latest" ]; then
            BASE_URL="https://github.com/${ACTION_REPO}/releases/latest/download"
          fi

          VERSION_CLEAN="${DEMONSTRA_VERSION#v}"
          TAR_NAME="demonstra_${VERSION_CLEAN}_${OS}_${GOARCH}.tar.gz"

          AUTH_HEADER=()
          if [ -n "$TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: token $TOKEN")
          fi

          # Attempt 1: Standalone binary asset
          if curl -sfL "${AUTH_HEADER[@]}" "$BASE_URL/$BIN_NAME" -o "$TARGET"; then
            echo "Downloaded standalone binary."
          # Attempt 2: Tarball archive
          elif curl -sfL "${AUTH_HEADER[@]}" "$BASE_URL/$TAR_NAME" -o "$INSTALL_DIR/archive.tar.gz"; then
            tar -xzf "$INSTALL_DIR/archive.tar.gz" -C "$INSTALL_DIR" demonstra
            rm -f "$INSTALL_DIR/archive.tar.gz"
            echo "Extracted binary from archive."
          # Attempt 3: gh CLI fallback
          elif command -v gh >/dev/null 2>&1 && GH_TOKEN="$TOKEN" gh release download "$DEMONSTRA_VERSION" --repo "$ACTION_REPO" --pattern "$BIN_NAME" --dir "$INSTALL_DIR" 2>/dev/null; then
            mv "$INSTALL_DIR/$BIN_NAME" "$TARGET"
            echo "Downloaded standalone binary via gh cli."
          else
            echo "::error::Could not download Demonstra binary ($BIN_NAME or $TAR_NAME) from $BASE_URL"
            exit 1
          fi
        fi

        chmod +x "$TARGET"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "Demonstra CLI installed to $TARGET"

    - name: Run Test Command and Publish Visual PR Review
      shell: bash
      env:
        TEST_CMD: ${{ inputs.command }}
        RESULTS_DIR: ${{ inputs.results-dir }}
        REPORT_FILE: ${{ inputs.report-file }}
        BRANCH: ${{ inputs.branch }}
        STRICT: ${{ inputs.strict }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        ARGS=(record --results-dir "$RESULTS_DIR" --branch "$BRANCH")
        if [ -n "$REPORT_FILE" ]; then
          ARGS+=(--report-file "$REPORT_FILE")
        fi
        if [ "$STRICT" = "true" ]; then
          ARGS+=(--strict)
        fi

        ARGS+=(-- sh -c "$TEST_CMD")
        demonstra "${ARGS[@]}"
